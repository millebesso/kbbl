[project]
name = "kbbl"
version = "0.1.0"
description = "An LLM-driven simulator of government formation in the Swedish Riksdag."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.9",
]

[project.scripts]
kbbl = "kbbl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbbl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
